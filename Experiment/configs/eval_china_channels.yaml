# Same experiment as eval_large.yaml, but every cloud role leaves OpenRouter:
#
#   memory_builder / adjudication_model -> a vendor direct OpenAI-compatible
#       channel that serves openai/gpt-4o-mini (point 33; Baidu Qianfan or
#       Zhipu BigModel below -- both are OpenAI-compatible with Bearer auth)
#   answer_model / judge_model -> Azure OpenAI (api-key header + deployment
#       path), model openai/gpt-5-mini (point 33)
#
# Why: OpenRouter geo-gates this machine ("This model is not available in your
# region"), for openai/gpt-5-mini and openai/gpt-4o-mini alike, and
# intermittently for every other model. A vendor-direct endpoint is not behind
# that gate.
#
# Point 33 caveat: the memory-construction role is an OpenAI model now, so this
# config needs a vendor channel that actually serves it. Azure OpenAI does, but
# upstream builds the *builder* client itself and knows no `azure` provider, so
# Azure can only carry the answerer and the judge (the two roles the experiment
# constructs itself); point the builder at an OpenAI-compatible gateway with
# Bearer auth (or an Azure-compatible gateway URL) instead.
#
# TODO fill these in Experiment/.env:
#   QIANFAN_API_KEY / QIANFAN_CHAT_COMPLETIONS_ENDPOINT
#   AZURE_API_KEY / AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_DEPLOYMENT
#   AZURE_OPENAI_API_VERSION (default 2024-10-21)
# The Azure deployment must serve openai/gpt-5-mini: the answerer and the judge
# name it explicitly with `extra.deployment`, which wins over
# AZURE_OPENAI_DEPLOYMENT in the environment.
#
# Two things to check with the real keys before a long run:
#   * the model ids the channel uses (Qianfan renames third-party models, e.g.
#     an "ernie"/"deepseek" style id; Zhipu's own platform uses glm-4.6/glm-4.5
#     style ids), and whether it serves openai/gpt-4o-mini at all. If it does
#     not, point &memory_chat at the closest model and record the substitution
#     in run_meta.
#   * that the endpoint tolerates the extra `enable_thinking` /
#     `chat_template_kwargs` fields the OpenAI-compatible client sends; if it
#     rejects them, the provider must be `azure`-style or an adapter is needed.

experiment:
  track: evaluation
models:
  embedding:
    provider: ollama
    model: qwen3-embedding
    base_url_env: OLLAMA_BASE_URL
    timeout: 600
  # `modelscope_openai_compatible` is upstream's generic Bearer-auth
  # OpenAI-compatible provider: it takes the endpoint and key from whatever env
  # names the config declares, which is exactly what a vendor direct channel is.
  # Point 33: memory construction is openai/gpt-4o-mini.
  memory_builder: &memory_chat
    provider: modelscope_openai_compatible
    model: gpt-4o-mini
    api_key_env: QIANFAN_API_KEY
    chat_completions_endpoint_env: QIANFAN_CHAT_COMPLETIONS_ENDPOINT
    temperature: 0.0
    timeout: 300
    extra_body:
      max_tokens: 16384
  adjudication_model: *memory_chat
  # Point 33: the answerer and the judge are both openai/gpt-5-mini, and both
  # go through Azure (the experiment builds these two clients itself, so the
  # `azure` provider is available to them -- it is not to the builder).
  answer_model: &gpt5_azure
    provider: azure
    model: gpt-5-mini
    # Reasoning model: default temperature only, and a real output budget so
    # reasoning tokens cannot swallow the answer / judge JSON.
    temperature: 1.0
    timeout: 300
    # deployment/api_version come from AZURE_OPENAI_* in .env unless they are
    # given here; the client sends the api-key header and the
    # /openai/deployments/... chat completions path.
    extra:
      deployment: gpt-5-mini
      max_tokens: 8192
  judge_model: *gpt5_azure
  window_planner: &control_chat
    provider: ollama
    model: qwen3.5:latest
    base_url_env: OLLAMA_BASE_URL
    temperature: 0.0
    timeout: 3600
  entity_judge: *control_chat
  controller: *control_chat
  decomposition_gate: *control_chat
  slm: *control_chat
memory:
  backend: v4
  memory_extraction_batch_turns: 64
  memory_extraction_workers: 8
  llm_max_retries: 2
  llm_retry_backoff_seconds: 1.0
  include_retrieval_trace_in_answer_prompt: false
  answer_context_mode: content aware
  backends:
    v4:
      database_path: data/memconflict_eval.sqlite3
      faiss_path: data/memconflict_eval_faiss
      memory_builder_model: memory_builder
      semantic_state_model: null
      embedding_model: embedding
      entity_judge_batch_size: 8
      entity_judge_workers: 2
      entity_auto_merge_policy: conservative
      prompt_output_tokens:
        # gpt-4o-mini (point 33) caps completions at 16384 tokens.
        memory_builder: 16384
        semantic_reducer: 8192
        window_boundary: 512
        entity_judge: 2048
        cross_window_adjudication: 16384
      window_planner:
        mode: model
        token_encoding: cl100k_base
        min_builder_input_tokens: 2048
        target_builder_input_tokens: 12000
        max_builder_input_tokens: 30000
        max_window_turns: 0
        max_window_atoms: 64
retrieval:
  strategy: multi_round
  controller_profile: teacher
  strategies:
    multi_round:
      controller_model: controller
      controller_max_retries: 2
      rank_fusion_constant: 60
      model_evidence_filter_enabled: false
evaluation:
  benchmarks:
  - locomo
  benchmark_dir: benchmark
  output_dir: runs
  locomo:
    answer_workers: 4
    answer_chunk_size: 1
    judge_workers: 4
    answer_max_retries: 2
    use_llm_judge: true
