# Point 11/13/33/34: large-model config for the real Table 3 scores.
#
# This file is memory-model arm B of the eval_large pair (Bailian glm-5.1) under
# the default name, so the existing commands, tools and scripts keep working.
# The pair, and the one place where it differs, is documented in
#   configs/eval_large_mem_glm51.yaml      (this arm)
#   configs/eval_large_mem_gpt4omini.yaml  (the cheap arm)
# Keep all three files in sync; the offline test suite asserts that the two arms
# differ only in `models.memory_builder` and
# `prompt_output_tokens.memory_builder`.
#
# Role split (documented so the run is reproducible):
#   * embedding / controller / window_planner / entity_judge / decomposition_gate
#     / slm -> the GPU server's Ollama, with exactly the models upstream
#     `default.yaml` specifies (qwen3-embedding, qwen3.5:latest). No substitution.
#   * memory_builder / adjudication / semantic_reducer -> Bailian (DashScope)
#     glm-5.1 (point 34/35: back from openai/gpt-4o-mini, which point 33 had put
#     here, and served by Bailian rather than OpenRouter's z-ai/glm-5.1). The
#     reducer follows memory_builder because `semantic_state_model` is null, so
#     this one block moves the whole memory construction side.
#   * answer_model / judge_model -> OpenRouter openai/gpt-5-mini (point 33: the
#     answering role moved off z-ai/glm-5.1 and the judge off
#     openai/gpt-4o-mini).
#
# Two constraints to keep in mind:
#   * glm-5.1 is a reasoning model, so both memory roles need a real output
#     budget: `prompt_output_tokens.memory_builder` is 32768 and
#     `cross_window_adjudication` is 16384 (4096 was not enough; measured
#     reasoning runs reached 4091 tokens and the JSON arrived truncated).
#   * gpt-5-mini is a reasoning model, so both roles that use it need a real
#     output budget and a longer timeout than the models they replaced (see
#     answer_model / judge_model below).
#
# Why glm-5.1 came back (point 34): with gpt-4o-mini on the memory side, the
# reducer answered with `evidence_event_refs` from other windows, upstream
# rejected it with "semantic operation references evidence outside supplied
# local event refs", the checkpoint guard invalidated the namespace and re-ran
# the session, and at temperature 0.0 the re-run reproduced the same answer --
# shard_1 persona 3c2e5fe5 died on session 6 that way. Every store on disk
# agrees that it is rare rather than model-specific: it happens in ~0.1% of the
# reducer calls (1/1,391 and 2/1,285 in the glm-5.1 arms of 2026-09-19/20,
# 0/104 in the gpt-4o-mini arm of 2026-09-21), the request never advertises a
# bad ref itself (0/2,873) and the extraction never cites an out-of-window turn
# id (0/16,700 items). One hit still costs a whole session re-run, so both
# guards stay: the reducer ref guard repairs the answer, and the strict-schema
# guard (point 37) asks the OpenAI-family lanes to answer under a JSON schema
# whose evidence refs are an enum of the window's refs.
#
# Why Bailian rather than OpenRouter (point 35): Bailian serves the same glm-5.1
# without OpenRouter's markup, and it is the provider the 2026-09-19/20 shard
# runs used, so the memory side stays comparable with them. Only the answering
# and judging roles stay on OpenRouter.
#
# Reach the Ollama roles through the SSH tunnel first:
#   ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa \
#       -N -L 41135:127.0.0.1:41135 tx@172.26.4.254
#
#   python Experiment/run_experiment.py --config Experiment/configs/eval_large.yaml
#
# Requires in Experiment/.env:
#   DASHSCOPE_API_KEY, DASHSCOPE_CHAT_COMPLETIONS_ENDPOINT   (memory side)
#   OPENROUTER_API_KEY, OPENROUTER_CHAT_COMPLETIONS_ENDPOINT (answer + judge)
#   OLLAMA_BASE_URL / OLLAMA_BASE_URLS                       (the six lanes)
#
# Verify the two channels before a long run (Bailian renames third-party models,
# so the id `glm-5.1` must be what the account actually serves):
#   python Experiment\tools\check_channels.py --config Experiment\configs\eval_large.yaml --roles memory_builder,adjudication_model,answer_model,judge_model

experiment:
  track: evaluation
models:
  embedding:
    provider: ollama
    model: qwen3-embedding
    base_url_env: OLLAMA_BASE_URL
    timeout: 600
  # Point 34/35: memory construction runs on Bailian's glm-5.1 (DashScope), the
  # model and provider the 2026-09-19/20 shard runs used; point 33 had moved it
  # to openai/gpt-4o-mini, see the header for why it came back. The reducer
  # inherits this block through `semantic_state_model: null`, so the whole memory
  # side is Bailian glm-5.1. No OpenRouter `provider:` routing here: that key is
  # an OpenRouter request field and Bailian rejects unknown body fields. The
  # client sends `enable_thinking: false` for provider `dashscope_bailian`
  # (Retrival-Mem memory/clients.py).
  # The builder's real limit comes from prompt_output_tokens.memory_builder
  # below (32768); extra_body.max_tokens is the provider-side ceiling.
  memory_builder: &memory_chat
    provider: dashscope_bailian
    model: glm-5.1
    api_key_env: DASHSCOPE_API_KEY
    chat_completions_endpoint_env: DASHSCOPE_CHAT_COMPLETIONS_ENDPOINT
    temperature: 0.0
    timeout: 300
    extra_body:
      max_tokens: 32768
  adjudication_model: *memory_chat
  # Point 33: answering and judging both run on openai/gpt-5-mini -- one block,
  # because they are the same model on the same lane (the judge additionally
  # asks for a JSON object per call).
  #
  # gpt-5-mini is a reasoning model: OpenAI only accepts the default temperature
  # for it, so 1.0 (OpenRouter drops the field on a serving endpoint that does
  # not take it) instead of the deterministic 0.0 used elsewhere. The output
  # budget covers reasoning tokens plus the short answer / judge JSON: too small
  # a budget can be spent entirely on reasoning and return empty content, which
  # surfaces as an empty answer or a `Judge_Error`, not as a retry.
  answer_model: &gpt5_chat
    provider: openrouter
    model: openai/gpt-5-mini
    api_key_env: OPENROUTER_API_KEY
    chat_completions_endpoint_env: OPENROUTER_CHAT_COMPLETIONS_ENDPOINT
    temperature: 1.0
    timeout: 300
    extra_body:
      max_tokens: 8192
      # gpt-5-mini has three OpenRouter endpoints: OpenAI, Azure, Azure. Keep
      # both roles on OpenAI's own endpoint and let Azure serve it when the
      # OpenAI endpoint is geo-filtered for a moment (the 403 arrives before any
      # model runs, so the fallback is the same model).
      # If the lane instead fails with a 400 that mentions reasoning (upstream
      # clients always ask for "no thinking"), score with
      # configs/eval_large_dsjudge.yaml and say so when reporting the numbers.
      provider:
        order: ["OpenAI", "Azure"]
        allow_fallbacks: true
  judge_model: *gpt5_chat
  window_planner: &control_chat
    provider: ollama
    model: qwen3.5:latest
    base_url_env: OLLAMA_BASE_URL
    temperature: 0.0
    timeout: 3600
  entity_judge: *control_chat
  controller: *control_chat
  decomposition_gate: *control_chat
  slm: *control_chat
memory:
  backend: v4
  memory_extraction_batch_turns: 64
  memory_extraction_workers: 8
  llm_max_retries: 2
  llm_retry_backoff_seconds: 1.0
  include_retrieval_trace_in_answer_prompt: false
  answer_context_mode: content aware
  backends:
    v4:
      database_path: data/memconflict_eval.sqlite3
      faiss_path: data/memconflict_eval_faiss
      memory_builder_model: memory_builder
      semantic_state_model: null
      embedding_model: embedding
      entity_judge_batch_size: 8
      entity_judge_workers: 2
      entity_auto_merge_policy: conservative
      # See smoke_small.yaml: the upstream 8192 default is sized for LoCoMo and
      # truncates MemConflict extractions.
      prompt_output_tokens:
        # Point 34: glm-5.1 is a reasoning model, so the extraction JSON shares
        # this budget with its reasoning tokens. 32768 is what upstream
        # `default.yaml` uses for the same model; shortening it truncates the
        # JSON and fails validation, so watch
        # Ingest.Retried_After_Validation_Error in sessions.jsonl.
        memory_builder: 32768
        semantic_reducer: 8192
        window_boundary: 512
        entity_judge: 2048
        # z-ai/glm-5.1 is a reasoning model (it is the adjudicator again since
        # point 34). It intermittently spends its whole output budget on
        # reasoning tokens and returns empty content, which fails the
        # adjudication validation (it must return a decision for every candidate
        # pair). 4096 was not enough headroom; measured reasoning runs reached
        # 4091 tokens. Keep a large budget so reasoning + JSON both fit.
        cross_window_adjudication: 16384
      window_planner:
        mode: model
        token_encoding: cl100k_base
        min_builder_input_tokens: 2048
        target_builder_input_tokens: 12000
        max_builder_input_tokens: 30000
        max_window_turns: 0
        max_window_atoms: 64
retrieval:
  strategy: multi_round
  controller_profile: teacher
  strategies:
    multi_round:
      controller_model: controller
      controller_max_retries: 2
      rank_fusion_constant: 60
      model_evidence_filter_enabled: false
evaluation:
  benchmarks:
  - locomo
  benchmark_dir: benchmark
  output_dir: runs
  locomo:
    answer_workers: 4
    answer_chunk_size: 1
    judge_workers: 4
    answer_max_retries: 2
    use_llm_judge: true

