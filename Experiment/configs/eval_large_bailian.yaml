# Point 27 / cost: was "same experiment as eval_large.yaml, but the three
# large-model roles come from Alibaba Bailian (DashScope) instead of OpenRouter,
# because OpenRouter adds a fee on top of the upstream provider".
#
# Point 33 emptied that trade: memory construction is openai/gpt-4o-mini and
# both answering and judging are openai/gpt-5-mini, and Bailian serves no OpenAI
# model. No role is left on Bailian, so this file is now role-identical to
# eval_large.yaml (and needs the same OPENROUTER_* credentials). It is kept
# because the shard commands, the chain state and the notes refer to this name;
# if you want a single config, delete it and point those commands at
# eval_large.yaml.
#
# Role split (identical to eval_large.yaml):
#   * memory_builder / adjudication_model -> OpenRouter openai/gpt-4o-mini.
#   * answer_model / judge_model -> OpenRouter openai/gpt-5-mini. Use
#     --config Experiment/configs/eval_large_dsjudge.yaml when the OpenRouter
#     judge is geo-filtered.
#   * embedding / controller / window_planner / entity_judge / decomposition_gate
#     / slm -> the GPU server's Ollama, exactly as in eval_large.yaml.
#
# Before a long run, verify the channels:
#
#   python Experiment\tools\check_channels.py --config Experiment\configs\eval_large_bailian.yaml --roles memory_builder,answer_model
#   python Experiment\tools\check_channels.py --config Experiment\configs\eval_large_bailian.yaml --roles judge_model
#
# Requires in Experiment/.env: OPENROUTER_API_KEY and
# OPENROUTER_CHAT_COMPLETIONS_ENDPOINT. No DASHSCOPE_* any more.

experiment:
  track: evaluation
models:
  embedding:
    provider: ollama
    model: qwen3-embedding
    base_url_env: OLLAMA_BASE_URL
    timeout: 600
  # Point 33: memory construction is openai/gpt-4o-mini (OpenRouter), the one
  # role in this config that Bailian cannot serve.
  memory_builder: &memory_chat
    provider: openrouter
    model: openai/gpt-4o-mini
    api_key_env: OPENROUTER_API_KEY
    chat_completions_endpoint_env: OPENROUTER_CHAT_COMPLETIONS_ENDPOINT
    temperature: 0.0
    timeout: 300
    extra_body:
      # gpt-4o-mini's hard completion cap; the per-stage budgets below stay
      # inside it (prompt_output_tokens.memory_builder = 16384).
      max_tokens: 16384
      provider:
        order: ["OpenAI", "Azure"]
        allow_fallbacks: true
  adjudication_model: *memory_chat
  # Point 33: answering and judging are both openai/gpt-5-mini, so no role in
  # this config comes from Bailian any more (same as eval_large.yaml).
  answer_model: &gpt5_chat
    provider: openrouter
    model: openai/gpt-5-mini
    api_key_env: OPENROUTER_API_KEY
    chat_completions_endpoint_env: OPENROUTER_CHAT_COMPLETIONS_ENDPOINT
    # Reasoning model: only the default temperature is accepted, and a small
    # output budget can be eaten by reasoning tokens (empty answer / Judge_Error).
    temperature: 1.0
    timeout: 300
    extra_body:
      max_tokens: 8192
      provider:
        order: ["OpenAI", "Azure"]
        allow_fallbacks: true
  judge_model: *gpt5_chat
  window_planner: &control_chat
    provider: ollama
    model: qwen3.5:latest
    base_url_env: OLLAMA_BASE_URL
    temperature: 0.0
    timeout: 3600
  entity_judge: *control_chat
  controller: *control_chat
  decomposition_gate: *control_chat
  slm: *control_chat
memory:
  backend: v4
  memory_extraction_batch_turns: 64
  memory_extraction_workers: 8
  llm_max_retries: 2
  llm_retry_backoff_seconds: 1.0
  include_retrieval_trace_in_answer_prompt: false
  answer_context_mode: content aware
  backends:
    v4:
      database_path: data/memconflict_eval.sqlite3
      faiss_path: data/memconflict_eval_faiss
      memory_builder_model: memory_builder
      semantic_state_model: null
      embedding_model: embedding
      entity_judge_batch_size: 8
      entity_judge_workers: 2
      entity_auto_merge_policy: conservative
      prompt_output_tokens:
        # gpt-4o-mini (point 33) caps completions at 16384 tokens; 32768 is
        # rejected as an invalid max_tokens, so this is both headroom and cap.
        memory_builder: 16384
        semantic_reducer: 8192
        window_boundary: 512
        entity_judge: 2048
        # Same value as eval_large.yaml: with gpt-4o-mini (point 33) the budget
        # is pure JSON headroom -- no reasoning tokens -- and 16384 is also the
        # model's hard completion cap.
        cross_window_adjudication: 16384
      window_planner:
        mode: model
        token_encoding: cl100k_base
        min_builder_input_tokens: 2048
        target_builder_input_tokens: 12000
        max_builder_input_tokens: 30000
        max_window_turns: 0
        max_window_atoms: 64
retrieval:
  strategy: multi_round
  controller_profile: teacher
  strategies:
    multi_round:
      controller_model: controller
      controller_max_retries: 2
      rank_fusion_constant: 60
      model_evidence_filter_enabled: false
evaluation:
  benchmarks:
  - locomo
  benchmark_dir: benchmark
  output_dir: runs
  locomo:
    answer_workers: 4
    answer_chunk_size: 1
    judge_workers: 4
    answer_max_retries: 2
    use_llm_judge: true
