# Point 27 / no-campus-network variant: the same experiment as
# eval_large_bailian.yaml, but *every* model role comes from Bailian (DashScope)
# instead of the GPU server's Ollama. Use it when the machine that runs the
# shard cannot reach the campus Ollama containers (e.g. a cloud host).
#
# Role split:
#   * memory_builder / adjudication_model / answer_model -> Bailian (as in
#     eval_large_bailian.yaml), model `glm-5.1`.
#   * window_planner / controller / entity_judge / decomposition_gate / slm ->
#     Bailian chat model (`qwen3.5-flash` below: the local 9.7B Q4 model's job is
#     schema-shaped JSON, not deep reasoning). Change it if check_channels or a
#     smoke run says otherwise.
#   * embedding -> Bailian `text-embedding-v4`. NOTE: the OpenAI-compatible
#     embedding client sends only {model, input}, so the dimension is whatever
#     the provider defaults to (1024 for v4), not the 4096 of
#     `qwen3-embedding`. A store built with one embedding model cannot be
#     continued with the other: switching embeddings means a fresh --output-dir
#     (run_experiment.py refuses --resume across a model change unless
#     --allow-model-change is passed).
#   * judge_model -> OpenRouter openai/gpt-4o-mini, unchanged (the protocol
#     names that judge). On a mainland-China host without a proxy, score with
#     --config Experiment/configs/eval_large_dsjudge.yaml instead, or copy the
#     three JSONL files back and score on a machine that has the proxy.
#
# Before a long run:
#   python Experiment\tools\check_channels.py --config Experiment\configs\eval_large_bailian_all.yaml
#   python Experiment\tools\check_channels.py --config Experiment\configs\eval_large_bailian_all.yaml --roles judge_model
#
# Requires in Experiment/.env: DASHSCOPE_API_KEY,
# DASHSCOPE_CHAT_COMPLETIONS_ENDPOINT, DASHSCOPE_EMBEDDINGS_ENDPOINT and (for the
# judge) OPENROUTER_API_KEY + OPENROUTER_CHAT_COMPLETIONS_ENDPOINT. No OLLAMA_*.

experiment:
  track: evaluation
models:
  embedding:
    provider: dashscope_bailian
    model: text-embedding-v4
    api_key_env: DASHSCOPE_API_KEY
    embeddings_endpoint_env: DASHSCOPE_EMBEDDINGS_ENDPOINT
    timeout: 120
  memory_builder: &bailian_large
    provider: dashscope_bailian
    model: glm-5.1
    api_key_env: DASHSCOPE_API_KEY
    chat_completions_endpoint_env: DASHSCOPE_CHAT_COMPLETIONS_ENDPOINT
    temperature: 0.0
    timeout: 300
    extra_body:
      max_tokens: 32768
  adjudication_model: *bailian_large
  answer_model: *bailian_large
  judge_model:
    provider: openrouter
    model: openai/gpt-4o-mini
    api_key_env: OPENROUTER_API_KEY
    chat_completions_endpoint_env: OPENROUTER_CHAT_COMPLETIONS_ENDPOINT
    temperature: 0.0
    timeout: 120
    extra_body:
      max_tokens: 512
      provider:
        order: ["OpenAI", "Azure"]
        allow_fallbacks: true
  window_planner: &bailian_control
    provider: dashscope_bailian
    model: qwen3.5-flash
    api_key_env: DASHSCOPE_API_KEY
    chat_completions_endpoint_env: DASHSCOPE_CHAT_COMPLETIONS_ENDPOINT
    temperature: 0.0
    timeout: 600
    extra_body:
      max_tokens: 8192
  entity_judge: *bailian_control
  controller: *bailian_control
  decomposition_gate: *bailian_control
  slm: *bailian_control
memory:
  backend: v4
  memory_extraction_batch_turns: 64
  memory_extraction_workers: 8
  llm_max_retries: 2
  llm_retry_backoff_seconds: 1.0
  include_retrieval_trace_in_answer_prompt: false
  answer_context_mode: content aware
  backends:
    v4:
      database_path: data/memconflict_eval.sqlite3
      faiss_path: data/memconflict_eval_faiss
      memory_builder_model: memory_builder
      semantic_state_model: null
      embedding_model: embedding
      entity_judge_batch_size: 8
      entity_judge_workers: 2
      entity_auto_merge_policy: conservative
      prompt_output_tokens:
        memory_builder: 32768
        semantic_reducer: 8192
        window_boundary: 512
        entity_judge: 2048
        cross_window_adjudication: 16384
      window_planner:
        mode: model
        token_encoding: cl100k_base
        min_builder_input_tokens: 2048
        target_builder_input_tokens: 12000
        max_builder_input_tokens: 30000
        max_window_turns: 0
        max_window_atoms: 64
retrieval:
  strategy: multi_round
  controller_profile: teacher
  strategies:
    multi_round:
      controller_model: controller
      controller_max_retries: 2
      rank_fusion_constant: 60
      model_evidence_filter_enabled: false
evaluation:
  benchmarks:
  - locomo
  benchmark_dir: benchmark
  output_dir: runs
  locomo:
    answer_workers: 4
    answer_chunk_size: 1
    judge_workers: 4
    answer_max_retries: 2
    use_llm_judge: true
