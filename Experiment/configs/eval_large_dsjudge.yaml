# Same roles as eval_large.yaml (point 33: memory construction on
# openai/gpt-4o-mini, answering on openai/gpt-5-mini), but the judge is
# DeepSeek's own API instead of OpenRouter's openai/gpt-5-mini.
#
# Why: OpenRouter geo-gates its OpenAI endpoints (gpt-5-mini now, gpt-4o-mini
# before point 33) and intermittently every other model from this machine --
# "This model is not available in your region." DeepSeek's direct endpoint
# answers from here, is cheap, and is a different vendor from the OpenAI models
# that build the memory, so the judge stays independent. The runner roles are
# untouched, so a run started with eval_large.yaml can be scored with this
# config (the judge only reads the answers).
#
#   python Experiment/run_scoring.py --run-dir Experiment/runs/<run> \
#     --config Experiment/configs/eval_large_dsjudge.yaml
#
# Requires OPENAI_API_KEY and OPENAI_CHAT_COMPLETIONS_ENDPOINT in Experiment/.env
# pointing at DeepSeek (the provider name is generic OpenAI-compatible), plus
# OPENROUTER_API_KEY + OPENROUTER_CHAT_COMPLETIONS_ENDPOINT for the runner roles
# of a fresh run (scoring an existing run needs only the DeepSeek pair).

experiment:
  track: evaluation
models:
  embedding:
    provider: ollama
    model: qwen3-embedding
    base_url_env: OLLAMA_BASE_URL
    timeout: 600
  # Point 33: memory construction is openai/gpt-4o-mini.
  memory_builder: &memory_chat
    provider: openrouter
    model: openai/gpt-4o-mini
    api_key_env: OPENROUTER_API_KEY
    chat_completions_endpoint_env: OPENROUTER_CHAT_COMPLETIONS_ENDPOINT
    temperature: 0.0
    timeout: 300
    extra_body:
      max_tokens: 16384
      provider:
        order: ["OpenAI", "Azure"]
        allow_fallbacks: true
  adjudication_model: *memory_chat
  # Point 33: the answering role is openai/gpt-5-mini, as in eval_large.yaml.
  answer_model: &gpt5_chat
    provider: openrouter
    model: openai/gpt-5-mini
    api_key_env: OPENROUTER_API_KEY
    chat_completions_endpoint_env: OPENROUTER_CHAT_COMPLETIONS_ENDPOINT
    # Reasoning model: default temperature only, and enough output budget that
    # reasoning tokens cannot swallow the answer.
    temperature: 1.0
    timeout: 300
    extra_body:
      max_tokens: 8192
      # Same OpenAI/Azure pin as eval_large.yaml.
      provider:
        order: ["OpenAI", "Azure"]
        allow_fallbacks: true
  # DeepSeek direct: region-available replacement for the protocol judge.
  judge_model:
    provider: openai
    model: deepseek-chat
    api_key_env: OPENAI_API_KEY
    chat_completions_endpoint_env: OPENAI_CHAT_COMPLETIONS_ENDPOINT
    temperature: 0.0
    timeout: 120
    extra_body:
      max_tokens: 512
  window_planner: &control_chat
    provider: ollama
    model: qwen3.5:latest
    base_url_env: OLLAMA_BASE_URL
    temperature: 0.0
    timeout: 3600
  entity_judge: *control_chat
  controller: *control_chat
  decomposition_gate: *control_chat
  slm: *control_chat
memory:
  backend: v4
  memory_extraction_batch_turns: 64
  memory_extraction_workers: 8
  llm_max_retries: 2
  llm_retry_backoff_seconds: 1.0
  include_retrieval_trace_in_answer_prompt: false
  answer_context_mode: content aware
  backends:
    v4:
      database_path: data/memconflict_eval.sqlite3
      faiss_path: data/memconflict_eval_faiss
      memory_builder_model: memory_builder
      semantic_state_model: null
      embedding_model: embedding
      entity_judge_batch_size: 8
      entity_judge_workers: 2
      entity_auto_merge_policy: conservative
      prompt_output_tokens:
        # gpt-4o-mini (point 33) caps completions at 16384 tokens.
        memory_builder: 16384
        semantic_reducer: 8192
        window_boundary: 512
        entity_judge: 2048
        cross_window_adjudication: 16384
      window_planner:
        mode: model
        token_encoding: cl100k_base
        min_builder_input_tokens: 2048
        target_builder_input_tokens: 12000
        max_builder_input_tokens: 30000
        max_window_turns: 0
        max_window_atoms: 64
retrieval:
  strategy: multi_round
  controller_profile: teacher
  strategies:
    multi_round:
      controller_model: controller
      controller_max_retries: 2
      rank_fusion_constant: 60
      model_evidence_filter_enabled: false
evaluation:
  benchmarks:
  - locomo
  benchmark_dir: benchmark
  output_dir: runs
  locomo:
    answer_workers: 4
    answer_chunk_size: 1
    judge_workers: 4
    answer_max_retries: 2
    use_llm_judge: true
