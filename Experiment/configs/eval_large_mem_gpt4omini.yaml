# Point 11/13/33/36: memory-model arm A (gpt-4o-mini) of the eval_large pair.
#
# The pair differs in exactly one place -- the memory-construction model:
#   * eval_large_mem_gpt4omini.yaml   (this file): OpenRouter openai/gpt-4o-mini
#   * eval_large_mem_glm51.yaml                 : Bailian dashscope_bailian/glm-5.1
# Everything else (answering and judging on openai/gpt-5-mini, the six Ollama
# lanes, the retrieval stack, the prompts) is identical, so running both arms
# isolates the memory model. Keep the two files in sync apart from
# `models.memory_builder` and `prompt_output_tokens.memory_builder`; the offline
# test suite asserts the rest stays byte-identical.
#
# Role split (documented so the run is reproducible):
#   * embedding / controller / window_planner / entity_judge / decomposition_gate
#     / slm -> the GPU server's Ollama, with exactly the models upstream
#     `default.yaml` specifies (qwen3-embedding, qwen3.5:latest). No substitution.
#   * memory_builder / adjudication / semantic_reducer -> OpenRouter
#     openai/gpt-4o-mini (the point-33 memory model). The reducer follows
#     memory_builder because `semantic_state_model` is null, so this one block
#     moves the whole memory construction side.
#   * answer_model / judge_model -> OpenRouter openai/gpt-5-mini (point 33: the
#     answering role moved off z-ai/glm-5.1 and the judge off
#     openai/gpt-4o-mini).
#
# Two constraints to keep in mind:
#   * gpt-4o-mini caps completions at 16,384 tokens, so
#     `prompt_output_tokens.memory_builder` is 16384 -- the provider rejects the
#     32768 that upstream uses with glm-5.1. A session whose extraction JSON
#     needs more is truncated and fails validation, so watch
#     Ingest.Retried_After_Validation_Error in sessions.jsonl.
#   * `cross_window_adjudication` stays 16384 even though gpt-4o-mini spends
#     none of it on reasoning (the value is shared with the glm-5.1 arm, which
#     needs it: measured reasoning runs reached 4091 tokens and the JSON arrived
#     truncated at 4096).
#   * gpt-5-mini is a reasoning model, so both roles that use it need a real
#     output budget and a longer timeout than the models they replaced (see
#     answer_model / judge_model below).
#
# What to watch in this arm (point 36): gpt-4o-mini is the cheaper memory
# model, but it is weaker at keeping the reducer's refs inside the supplied
# window. Measured on 2026-09-21: the glm-5.1 runs of 2026-09-19/20 have zero
# "semantic operation references evidence outside supplied local event refs"
# hits across every store on disk, while both gpt-4o-mini runs hit it within
# minutes -- shard_1 persona 3c2e5fe5 died on session 6 that way (the checkpoint
# guard re-runs the session, and at temperature 0.0 the re-run reproduces the
# same answer, so the persona's budget runs out). memconflict_eval/reducer_guard.py
# drops the unresolvable refs instead, so the failure is repaired rather than
# fatal in both arms; count Ingest.Retried_After_Validation_Error when comparing
# the two arms.
#
# Reach the Ollama roles through the SSH tunnel first:
#   ssh -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa \
#       -N -L 41135:127.0.0.1:41135 tx@172.26.4.254
#
#   python Experiment/run_experiment.py --config Experiment/configs/eval_large_mem_gpt4omini.yaml
#
# Requires in Experiment/.env:
#   OPENROUTER_API_KEY, OPENROUTER_CHAT_COMPLETIONS_ENDPOINT (every cloud role)
#   OLLAMA_BASE_URL / OLLAMA_BASE_URLS                       (the six lanes)
# No DASHSCOPE_*: no role of this arm comes from Bailian.
#
# Verify the two channels before a long run (Bailian renames third-party models,
# so the id `glm-5.1` must be what the account actually serves):
#   python Experiment\tools\check_channels.py --config Experiment\configs\eval_large.yaml --roles memory_builder,adjudication_model,answer_model,judge_model

experiment:
  track: evaluation
models:
  embedding:
    provider: ollama
    model: qwen3-embedding
    base_url_env: OLLAMA_BASE_URL
    timeout: 600
  # Point 33/36: memory construction runs on openai/gpt-4o-mini, the cheap arm
  # of the pair. The reducer inherits this block through `semantic_state_model:
  # null`, so the whole memory construction side follows it. The builder's real
  # limit comes from prompt_output_tokens.memory_builder below (16384);
  # extra_body.max_tokens is the provider-side ceiling.
  memory_builder: &memory_chat
    provider: openrouter
    model: openai/gpt-4o-mini
    api_key_env: OPENROUTER_API_KEY
    chat_completions_endpoint_env: OPENROUTER_CHAT_COMPLETIONS_ENDPOINT
    temperature: 0.0
    timeout: 300
    extra_body:
      max_tokens: 16384
      # gpt-4o-mini is served by OpenRouter's OpenAI and Azure endpoints; both
      # are the same model, so a momentary geo-403 on OpenAI's endpoint does not
      # kill a persona's ingest. allow_fallbacks keeps a long run alive.
      provider:
        order: ["OpenAI", "Azure"]
        allow_fallbacks: true
  adjudication_model: *memory_chat
  # Point 33: answering and judging both run on openai/gpt-5-mini -- one block,
  # because they are the same model on the same lane (the judge additionally
  # asks for a JSON object per call).
  #
  # gpt-5-mini is a reasoning model: OpenAI only accepts the default temperature
  # for it, so 1.0 (OpenRouter drops the field on a serving endpoint that does
  # not take it) instead of the deterministic 0.0 used elsewhere. The output
  # budget covers reasoning tokens plus the short answer / judge JSON: too small
  # a budget can be spent entirely on reasoning and return empty content, which
  # surfaces as an empty answer or a `Judge_Error`, not as a retry.
  answer_model: &gpt5_chat
    provider: openrouter
    model: openai/gpt-5-mini
    api_key_env: OPENROUTER_API_KEY
    chat_completions_endpoint_env: OPENROUTER_CHAT_COMPLETIONS_ENDPOINT
    temperature: 1.0
    timeout: 300
    extra_body:
      max_tokens: 8192
      # gpt-5-mini has three OpenRouter endpoints: OpenAI, Azure, Azure. Keep
      # both roles on OpenAI's own endpoint and let Azure serve it when the
      # OpenAI endpoint is geo-filtered for a moment (the 403 arrives before any
      # model runs, so the fallback is the same model).
      # If the lane instead fails with a 400 that mentions reasoning (upstream
      # clients always ask for "no thinking"), score with
      # configs/eval_large_dsjudge.yaml and say so when reporting the numbers.
      provider:
        order: ["OpenAI", "Azure"]
        allow_fallbacks: true
  judge_model: *gpt5_chat
  window_planner: &control_chat
    provider: ollama
    model: qwen3.5:latest
    base_url_env: OLLAMA_BASE_URL
    temperature: 0.0
    timeout: 3600
  entity_judge: *control_chat
  controller: *control_chat
  decomposition_gate: *control_chat
  slm: *control_chat
memory:
  backend: v4
  memory_extraction_batch_turns: 64
  memory_extraction_workers: 8
  llm_max_retries: 2
  llm_retry_backoff_seconds: 1.0
  include_retrieval_trace_in_answer_prompt: false
  answer_context_mode: content aware
  backends:
    v4:
      database_path: data/memconflict_eval.sqlite3
      faiss_path: data/memconflict_eval_faiss
      memory_builder_model: memory_builder
      semantic_state_model: null
      embedding_model: embedding
      entity_judge_batch_size: 8
      entity_judge_workers: 2
      entity_auto_merge_policy: conservative
      # See smoke_small.yaml: the upstream 8192 default is sized for LoCoMo and
      # truncates MemConflict extractions.
      prompt_output_tokens:
        # gpt-4o-mini caps completions at 16384 tokens; 32768 (the glm-5.1 arm's
        # value) is rejected by the provider as an invalid max_tokens. 16384 is
        # therefore both the headroom and the ceiling -- a session whose
        # extraction JSON needs more will be truncated and fail validation, so
        # watch Ingest.Retried_After_Validation_Error in sessions.jsonl.
        memory_builder: 16384
        semantic_reducer: 8192
        window_boundary: 512
        entity_judge: 2048
        # z-ai/glm-5.1 is a reasoning model (it is the adjudicator again since
        # point 34). It intermittently spends its whole output budget on
        # reasoning tokens and returns empty content, which fails the
        # adjudication validation (it must return a decision for every candidate
        # pair). 4096 was not enough headroom; measured reasoning runs reached
        # 4091 tokens. Keep a large budget so reasoning + JSON both fit.
        cross_window_adjudication: 16384
      window_planner:
        mode: model
        token_encoding: cl100k_base
        min_builder_input_tokens: 2048
        target_builder_input_tokens: 12000
        max_builder_input_tokens: 30000
        max_window_turns: 0
        max_window_atoms: 64
retrieval:
  strategy: multi_round
  controller_profile: teacher
  strategies:
    multi_round:
      controller_model: controller
      controller_max_retries: 2
      rank_fusion_constant: 60
      model_evidence_filter_enabled: false
evaluation:
  benchmarks:
  - locomo
  benchmark_dir: benchmark
  output_dir: runs
  locomo:
    answer_workers: 4
    answer_chunk_size: 1
    judge_workers: 4
    answer_max_retries: 2
    use_llm_judge: true

