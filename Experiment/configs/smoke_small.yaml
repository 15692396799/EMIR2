# Point 11/12: small-model config to get the whole pipeline running end to end.
#
# Every role is served by Bailian (DashScope), including embeddings, so this
# config has NO local dependency at all: no Ollama models have to be pulled and
# no GPU is needed. Use it to validate the flow, then switch to
# configs/eval_large.yaml for the real scores.
#
#   python Experiment/run_experiment.py --config Experiment/configs/smoke_small.yaml ...
#
# Requires DASHSCOPE_API_KEY, DASHSCOPE_CHAT_COMPLETIONS_ENDPOINT and
# DASHSCOPE_EMBEDDINGS_ENDPOINT in Experiment/.env.

experiment:
  track: evaluation
models:
  embedding:
    provider: dashscope_bailian
    model: text-embedding-v3
    api_key_env: DASHSCOPE_API_KEY
    embeddings_endpoint_env: DASHSCOPE_EMBEDDINGS_ENDPOINT
    timeout: 120
  memory_builder: &small_chat
    provider: dashscope_bailian
    model: qwen3.5-flash
    api_key_env: DASHSCOPE_API_KEY
    chat_completions_endpoint_env: DASHSCOPE_CHAT_COMPLETIONS_ENDPOINT
    temperature: 0.0
    timeout: 300
    extra_body:
      # The V4 extraction JSON is large: a full session needs well over 8k
      # output tokens, so this must stay at the upstream value (default.yaml
      # uses 32768). Truncating it corrupts the JSON.
      max_tokens: 32768
  adjudication_model: *small_chat
  window_planner: *small_chat
  entity_judge: *small_chat
  controller: *small_chat
  decomposition_gate: *small_chat
  slm: *small_chat
  answer_model: *small_chat
  judge_model: *small_chat
memory:
  backend: v4
  memory_extraction_batch_turns: 64
  memory_extraction_workers: 4
  llm_max_retries: 2
  llm_retry_backoff_seconds: 1.0
  include_retrieval_trace_in_answer_prompt: false
  answer_context_mode: content aware
  backends:
    v4:
      database_path: data/memconflict_smoke.sqlite3
      faiss_path: data/memconflict_smoke_faiss
      memory_builder_model: memory_builder
      semantic_state_model: null
      embedding_model: embedding
      entity_judge_batch_size: 8
      entity_judge_workers: 2
      entity_auto_merge_policy: conservative
      # The upstream default caps the builder at 8192 output tokens, which was
      # sized for LoCoMo sessions (~670-1360 tokens each). MemConflict sessions
      # are ~3840 tokens on average, and the extraction JSON exceeds 8192, so the
      # response was truncated mid-JSON and failed validation. Raise the cap.
      prompt_output_tokens:
        memory_builder: 32768
        semantic_reducer: 8192
        window_boundary: 512
        entity_judge: 2048
        cross_window_adjudication: 4096
      window_planner:
        mode: model
        token_encoding: cl100k_base
        min_builder_input_tokens: 2048
        target_builder_input_tokens: 12000
        max_builder_input_tokens: 30000
        max_window_turns: 0
        max_window_atoms: 64
retrieval:
  strategy: multi_round
  controller_profile: teacher
  strategies:
    multi_round:
      controller_model: controller
      controller_max_retries: 2
      rank_fusion_constant: 60
      model_evidence_filter_enabled: false
evaluation:
  benchmarks:
  - locomo
  benchmark_dir: benchmark
  output_dir: runs
  locomo:
    answer_workers: 4
    answer_chunk_size: 1
    judge_workers: 4
    answer_max_retries: 2
    use_llm_judge: true

